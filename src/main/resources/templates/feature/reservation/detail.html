<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Reservation detail</title>
</head>
<body>
<section class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold">Reservation #<span th:text="${reservation.id}"></span></h1>
            <p class="text-sm text-base-content/70">Operational status and timeline.</p>
        </div>
        <a th:href="@{/reservations}" class="btn btn-outline btn-sm">Back</a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="card bg-base-200 border border-base-300 shadow-sm">
            <div class="card-body">
                <h2 class="card-title">Booking details</h2>
                <dl class="grid grid-cols-2 gap-2 text-sm">
                    <dt class="font-semibold">Vehicle</dt>
                    <dd th:text="${reservation.vehicle.brand + ' ' + reservation.vehicle.model}"></dd>
                    <dt class="font-semibold">User</dt>
                    <dd th:text="${reservation.user.fullName}"></dd>
                    <dt class="font-semibold">Start</dt>
                    <dd th:text="${#temporals.format(reservation.startTime, 'dd.MM.yyyy HH:mm')}"></dd>
                    <dt class="font-semibold">End</dt>
                    <dd th:text="${#temporals.format(reservation.endTime, 'dd.MM.yyyy HH:mm')}"></dd>
                    <dt class="font-semibold">State</dt>
                    <dd th:replace="~{components/badge :: reservationStateBadge(${reservation.state})}"></dd>
                </dl>
            </div>
        </div>

        <div class="card bg-base-200 border border-base-300 shadow-sm">
            <div class="card-body">
                <h2 class="card-title">Booking controls</h2>
                <div class="flex flex-wrap gap-2">
                    <form th:if="${reservation.state.name() == 'DRAFT' or reservation.state.name() == 'PENDING_APPROVAL' or reservation.state.name() == 'CONFIRMED'}" th:action="@{/reservations/{id}/cancel(id=${reservation.id})}" method="post">
                        <button type="submit" class="btn btn-error btn-sm">Cancel reservation</button>
                    </form>
                    <form th:if="${reservation.state.name() == 'DRAFT'}" th:action="@{/reservations/{id}/confirm(id=${reservation.id})}" method="post">
                        <button type="submit" class="btn btn-success btn-sm">Confirm</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
