<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Form</title>
</head>
<body>
<section>
  <div class="card bg-base-200 border border-base-300 shadow-md max-w-2xl mx-auto">
    <div class="card-body">
      <h2 class="card-title text-xl font-bold mb-4" th:text="${vehicleId} ? 'Edit Vehicle' : 'Add Vehicle'">Add Vehicle</h2>

      <form th:action="${vehicleId} ? @{/vehicles/{id}(id=${vehicleId})} : @{/vehicles}"
            th:object="${vehicleForm}" method="post" class="space-y-4">

        <div th:replace="~{components/forms :: input('Brand', 'brand', 'e.g., Toyota', 'text')}"></div>
        <div th:replace="~{components/forms :: input('Model', 'model', 'e.g., Corolla', 'text')}"></div>
        <div th:replace="~{components/forms :: input('Year', 'year', 'e.g., 2024', 'number')}"></div>
        <div th:replace="~{components/forms :: input('License Plate', 'licensePlate', 'e.g., ABC-1234', 'text')}"></div>
        <div th:replace="~{components/forms :: input('VIN (17 characters)', 'vin', '17-character VIN', 'text')}"></div>

        <div class="card-actions justify-end mt-6 gap-2">
          <a href="/vehicles" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">Save Vehicle</button>
        </div>
      </form>
    </div>
  </div>
</section>
</body>
</html>
