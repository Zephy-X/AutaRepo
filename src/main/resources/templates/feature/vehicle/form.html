<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Form</title>
</head>
<body>
<section>
  <div class="card bg-base-200 border border-base-300 shadow-md max-w-2xl mx-auto">
    <div class="card-body">
      <h2 class="card-title text-xl font-bold mb-4" th:text="${vehicleId} ? 'Edit Vehicle' : 'Add Vehicle'">Add Vehicle</h2>

      <form th:action="${vehicleId} ? @{/vehicles/{id}(id=${vehicleId})} : @{/vehicles}"
            th:object="${vehicleForm}" method="post" class="space-y-4">

        <div class="form-control w-full">
          <label class="label"><span class="label-text font-medium">Brand</span></label>
          <input type="text" class="input input-bordered w-full focus:input-primary"
                 th:field="*{brand}" placeholder="e.g., Toyota"
                 th:classappend="${#fields.hasErrors('brand')} ? 'input-error' : ''" />
          <label class="label" th:if="${#fields.hasErrors('brand')}">
            <span class="label-text-alt text-error text-xs" th:errors="*{brand}">Validation error</span>
          </label>
        </div>

        <div class="form-control w-full">
          <label class="label"><span class="label-text font-medium">Model</span></label>
          <input type="text" class="input input-bordered w-full focus:input-primary"
                 th:field="*{model}" placeholder="e.g., Corolla"
                 th:classappend="${#fields.hasErrors('model')} ? 'input-error' : ''" />
          <label class="label" th:if="${#fields.hasErrors('model')}">
            <span class="label-text-alt text-error text-xs" th:errors="*{model}">Validation error</span>
          </label>
        </div>

        <div class="form-control w-full">
          <label class="label"><span class="label-text font-medium">Year</span></label>
          <input type="number" class="input input-bordered w-full focus:input-primary"
                 th:field="*{year}" placeholder="e.g., 2024"
                 th:classappend="${#fields.hasErrors('year')} ? 'input-error' : ''" />
          <label class="label" th:if="${#fields.hasErrors('year')}">
            <span class="label-text-alt text-error text-xs" th:errors="*{year}">Validation error</span>
          </label>
        </div>

        <div class="form-control w-full">
          <label class="label"><span class="label-text font-medium">License Plate</span></label>
          <input type="text" class="input input-bordered w-full focus:input-primary font-mono"
                 th:field="*{licensePlate}" placeholder="e.g., ABC-1234"
                 th:classappend="${#fields.hasErrors('licensePlate')} ? 'input-error' : ''" />
          <label class="label" th:if="${#fields.hasErrors('licensePlate')}">
            <span class="label-text-alt text-error text-xs" th:errors="*{licensePlate}">Validation error</span>
          </label>
        </div>

        <div class="form-control w-full">
          <label class="label"><span class="label-text font-medium">VIN (17 characters)</span></label>
          <input type="text" class="input input-bordered w-full focus:input-primary font-mono text-sm"
                 th:field="*{vin}" placeholder="17-character VIN"
                 th:classappend="${#fields.hasErrors('vin')} ? 'input-error' : ''" />
          <label class="label" th:if="${#fields.hasErrors('vin')}">
            <span class="label-text-alt text-error text-xs" th:errors="*{vin}">Validation error</span>
          </label>
        </div>

        <div class="card-actions justify-end mt-6 gap-2">
          <a href="/vehicles" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">Save Vehicle</button>
        </div>
      </form>
    </div>
  </div>
</section>
</body>
</html>
