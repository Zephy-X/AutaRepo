<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Management</title>
</head>
<body>
<section class="flex flex-col gap-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">Fleet Management</h1>
      <p class="text-sm text-base-content/70 mt-1" th:text="'Total vehicles: ' + ${vehicles.size()}">Total vehicles: 0</p>
    </div>
    <a href="/vehicles/create" class="btn btn-primary btn-sm">+ Add Vehicle</a>
  </div>

  <div class="overflow-x-auto rounded-box border border-base-300 bg-base-200/50">
    <table class="table table-zebra w-full">
      <thead class="bg-base-200 text-xs text-base-content/70">
      <tr>
        <th>Brand</th>
        <th>Model</th>
        <th>License Plate</th>
        <th>VIN</th>
        <th>Year</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="vehicle : ${vehicles}">
        <td class="font-medium" th:text="${vehicle.brand}">Toyota</td>
        <td th:text="${vehicle.model}">Corolla</td>
        <td class="font-mono" th:text="${vehicle.licensePlate}">ABC-1234</td>
        <td class="font-mono text-xs" th:text="${vehicle.vin}">17-digit-vin-here</td>
        <td th:text="${vehicle.year}">2024</td>
        <td>
          <span th:if="${vehicle.active}" class="badge badge-success badge-sm">Active</span>
          <span th:if="${!vehicle.active}" class="badge badge-neutral badge-sm">Inactive</span>
        </td>
        <td>
          <div class="join">
            <a th:href="@{/vehicles/{id}/edit(id=${vehicle.id})}" class="btn btn-xs btn-ghost join-item">Edit</a>
            <form th:action="@{/vehicles/{id}/toggle-availability(id=${vehicle.id})}" method="post" class="inline">
              <button type="submit" class="btn btn-xs btn-ghost join-item">Toggle</button>
            </form>
            <form th:action="@{/vehicles/{id}/delete(id=${vehicle.id})}" method="post" class="inline">
              <button type="submit" class="btn btn-xs btn-error btn-ghost join-item" onclick="return confirm('Delete vehicle?')">Delete</button>
            </form>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div th:if="${vehicles.isEmpty()}" class="text-center py-12">
    <p class="text-base-content/70 mb-4">No vehicles in the fleet yet.</p>
    <a href="/vehicles/create" class="btn btn-primary btn-sm">Add your first vehicle</a>
  </div>
</section>
</body>
</html>
