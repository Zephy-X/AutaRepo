<div xmlns:th="http://www.thymeleaf.org">
    <div th:fragment="alert(message, type)" class="alert" th:classappend="${type == 'error'} ? 'alert-error' : (${type == 'warning'} ? 'alert-warning' : 'alert-success')">
        <span th:text="${message}">Message</span>
    </div>

    <div th:fragment="alerts" class="space-y-3">
        <div th:if="${successMessage}" class="alert alert-success shadow-lg">
            <span th:text="${successMessage}">Success</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error shadow-lg">
            <span th:text="${errorMessage}">Error</span>
        </div>
    </div>
</div>
