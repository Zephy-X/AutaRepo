<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="vehicleCard(vehicle)" class="card bg-base-200 border border-base-300 shadow-sm h-full">
    <div class="card-body gap-3">
        <div class="flex items-start justify-between gap-3">
            <div>
                <h3 class="card-title text-lg" th:text="${vehicle.brand + ' ' + vehicle.model}">Vehicle</h3>
                <p class="text-sm text-base-content/70" th:text="${vehicle.licensePlate + ' · ' + vehicle.year}">Plate</p>
            </div>
            <span th:if="${vehicle.requiresApproval}" class="badge badge-secondary">Requires approval</span>
        </div>
        <div class="flex gap-2 text-xs">
            <span class="badge badge-outline" th:text="${vehicle.active ? 'Active' : 'Inactive'}">Status</span>
            <span th:if="${vehicle.requiresApproval}" class="badge badge-warning">Luxury tier</span>
        </div>
    </div>
</div>
</body>
</html>
